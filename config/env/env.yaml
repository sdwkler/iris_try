# 添加默认环境配置
_target_: envs.init.make_tetris

train:
  _target_: ${.._target_}  # 继承默认目标
  size: 64  # 图像尺寸
  max_episode_steps: 10000  # 单局最大步数
  reward_scale: 1.0  # 奖励缩放

test:
  _target_: ${.._target_}
  size: ${..train.size}
  max_episode_steps: 20000  # 测试时放宽步数限制
  reward_scale: ${..train.reward_scale}

keymap: tetris  # 俄罗斯方块专用按键映射
