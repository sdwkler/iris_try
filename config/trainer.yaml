defaults:
  - _self_
  - tokenizer: tokenizer
  - world_model: world_model
  - env: env
  - datasets:
      train: episodes_dataset_ram_monitoring
      test: episodes_dataset

wandb:
  mode: online
  project: tetris_iris
  entity: null
  name: tetris-iris-run
  group: null
  tags: [tetris, iris, atari]
  notes: "俄罗斯方块IRIS训练"

initialization:
  path_to_checkpoint: null
  load_tokenizer: True
  load_world_model: True
  load_actor_critic: True

common:
  epochs: 1000
  device: cuda:0
  checkpoint_dir: checkpoints
  checkpoint_every: 20
  do_checkpoint: True
  seed: 42
  sequence_length: 64
  resume: False

collection:
  train:
    num_envs: 4
    stop_after_epochs: 800
    num_episodes_to_save: 10
    config:
      epsilon: 0.01
      should_sample: True
      temperature: 1.0
      num_steps: 1000  # 俄罗斯方块单局步数较长
      burn_in: ${training.actor_critic.burn_in}
  test:
    num_envs: 4
    num_episodes_to_save: ${collection.train.num_episodes_to_save}
    config:
      epsilon: 0.0
      should_sample: False
      temperature: 0.5
      num_episodes: 32
      burn_in: ${training.actor_critic.burn_in}

training:
  should: True
  learning_rate: 0.0001
  tokenizer:
    batch_num_samples: 256
    grad_acc_steps: 1
    max_grad_norm: 10.0
    start_after_epochs: 5
    steps_per_epoch: 200
  world_model:
    batch_num_samples: 64
    grad_acc_steps: 1
    max_grad_norm: 10.0
    weight_decay: 0.01
    start_after_epochs: 25
    steps_per_epoch: 200
  actor_critic:
    use_original_obs: False
    batch_num_samples: 64
    grad_acc_steps: 1
    max_grad_norm: 10.0
    start_after_epochs: 50
    steps_per_epoch: 200
    imagine_horizon: ${common.sequence_length}
    burn_in: 20
    gamma: 0.99
    lambda_: 0.95
    entropy_weight: 0.001

evaluation:
  should: True
  every: 10
  steps_per_component: 50
  tokenizer:
    batch_num_samples: ${training.tokenizer.batch_num_samples}
    start_after_epochs: ${training.tokenizer.start_after_epochs}
    save_reconstructions: True
  world_model:
    batch_num_samples: ${training.world_model.batch_num_samples}
    start_after_epochs: ${training.world_model.start_after_epochs}
  actor_critic:
    num_episodes_to_save: 5
    horizon: ${training.actor_critic.imagine_horizon}
    start_after_epochs: ${training.actor_critic.start_after_epochs}
