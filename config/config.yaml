mode: train            # train / eval
seed: 42
output_dir: outputs
log_interval: 50
save_every: 200
device: auto           # auto / cpu / cuda

# 环境
env:
  name: tetris
  height: 20
  width: 10
  render_frame: true   # 把内部格子渲染为图像（用于视觉 encoder）
  frame_channels: 3    # RGB渲染通道数
  image_size: [84, 84] # H,W after resize for encoder

# 采集 / 状态表示
collector:
  num_workers: 1
  frame_stack: 4       # 序列长度（Transformer 的 seq_len）
  max_episode_steps: 1000

# Replay / Dataset
replay:
  capacity: 50000
  min_size: 1000
  batch_size: 64
  n_step: 1

# 视觉 encoder
visual:
  type: cnn_encoder
  image_size: [84, 84]
  cnn:
    channels: [32, 64, 128]
    kernel_sizes: [8,4,3]
    strides: [4,2,1]
    fc_dim: 256

# Transformer / sequence model
transformer:
  seq_len: 4
  d_model: 256
  n_heads: 4
  num_layers: 3
  mlp_dim: 512
  dropout: 0.1

# 策略 / Agent
agent:
  algorithm: dqn
  hidden: 256
  lr: 1e-4
  gamma: 0.99
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 20000
  update_target_every: 1000

# 训练
training:
  episodes: 2000
  eval_every: 200
  eval_episodes: 10
  max_steps_per_episode: 1000
