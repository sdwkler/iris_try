mode: train
seed: 42
output_dir: outputs
log_interval: 50
save_every: 200
device: auto
env:
  name: tetris
  height: 20
  width: 10
  render_frame: true
  frame_channels: 3
  image_size: [84, 84]

collector:
  frame_stack: 4
  max_episode_steps: 1000

replay:
  capacity: 50000
  batch_size: 64

visual:
  image_size: [84,84]
  cnn:
    channels: [32,64,128]
    kernel_sizes: [8,4,3]
    strides: [4,2,1]
    fc_dim: 256
  vq:
    num_embeddings: 512
    embedding_dim: 64
    commitment_cost: 0.25
    decay: 0.99

transformer:
  seq_len: 4
  d_model: 256
  n_heads: 4
  num_layers: 3
  mlp_dim: 512
  dropout: 0.1

agent:
  algorithm: a2c
  lr: 2.5e-4
  gamma: 0.99
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

training:
  episodes: 2000
  eval_every: 200
  eval_episodes: 10
  max_steps_per_episode: 1000