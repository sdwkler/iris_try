mode: train
seed: 42
output_dir: outputs
device: auto

env:
  id: "ALE/MontezumaRevenge-v5"
  num_envs: 8
  frame_stack: 4
  image_size: [84, 84]
  grayscale: false
  atari_frame_skip: 4

visual:
  pretrain: true
  image_size: [84,84]
  channels: 3
  vq:
    num_embeddings: 512
    embedding_dim: 64
    commitment_cost: 0.25
    decay: 0.99
  encoder:
    hidden: 128
  decoder:
    hidden: 128
  pretrain:
    batch_size: 64
    epochs: 10
    lr: 1e-3

rnd:
  enabled: true
  predictor_hidden: 256
  target_hidden: 256
  rnd_lr: 0.0001
  rnd_scale: 1.0

transformer:
  seq_len: 4
  d_model: 256
  n_heads: 4
  num_layers: 4
  mlp_dim: 512
  dropout: 0.1

agent:
  algorithm: ppo
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  epochs: 4
  minibatch_size: 64
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5

training:
  total_updates: 1000
  steps_per_env: 128
  eval_every: 1000
  eval_episodes: 5
  save_every: 500

logging:
  save_video: true
  video_dir: outputs/videos